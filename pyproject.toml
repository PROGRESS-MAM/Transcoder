[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "transcoder"
description = "Mediendateien mit ffmpeg rendern und analysieren"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "numpy",
    "toolbox @ git+https://github.com/PROGRESS-MAM/TOOLBOX.git@main",
]


[project.optional-dependencies]
build = [
    "pyinstaller>=6",
]


[tool.setuptools.dynamic]
version = {attr = "transcoder.transcoder.app_version"}


[tool.setuptools.packages.find]
where = ["."]
include = ["transcoder*", "oneoff*"]


[tool.setuptools.package-data]
transcoder = ["presets/*.toml"]
